<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: rgb(51, 73, 73);
            color: rgb(28, 17, 17);
            height: 90px;
            width: 90px;
            margin: 30px;
        }
        .visible{
            overflow: visible;
        }
        .hidden{
            overflow: hidden;
        }
        .scroll{
            overflow: scroll;
        }
        .auto{
            overflow: auto;
        }
    </style>
</head>
<body>
    <div class="box visible">chelsea needs help, that what he said</div>
    <div class="box hidden">well im surviving somehow, life is like spoon, lalalalalalalal we are family, an't nobod</div>
    <div class="box scroll">well im surviving somehow, life is like spoon, lalalalalalalal we are family</div>
    <div class="box auto">well im surviving somehow, life is like spoon, lalalalalalalal we are family</div>
</body>
</html>
