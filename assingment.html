<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2{
            color: rgb(170, 105, 105);
        }
        p{
            color: rgb(154, 140, 140);
        }
        aside {
            width: 250px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
       
        a{
            display: block;
            background-color: rgb(170, 105, 105);
            height: 50px;
            
            padding-left: 12px;
            padding-bottom: 10px;
            text-decoration: none;
            color: white;
        }
        .james{
            border-radius: 8px;
            padding-top: 8px;
        }
        .box{
            background-color: rgb(154, 140, 140);
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
    </style>
</head>
<body>
    <h2>Vertical Sidebar Menu</h2>
    <p>The cuurent page id highlighted with a blue backgroud. Hover over other links to see the effect</p>
    <aside class="james">
        <a href="#" class="box">Dashboard</a>
        <a href="#">Services</a>
        <a href="#">Project</a>
        <a href="#">Team</a>
        <a href="#">Contact</a>
    </aside>
</body>
</html>
