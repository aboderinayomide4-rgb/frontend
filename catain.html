<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border: 1px solid rgb(183, 8, 49);
            width: 90%;
            border-collapse: collapse;

        }
        th,td{
            border: 1px solid black;
            color:brown
            text-align: center;
    
        }
        tr:hover{
            background-color: yellowgreen;
        }
        tr:nth-child(2){
            background-color: goldenrod;
            color: white;
        }
        tr:nth-child(even){
      background-color: gray;
       color: white;
        }
         tr:nth-child(2n+1){
      background-color: green;
       color: white;
        }
    </style>
</head>
<body>
    <h2>Tables in HTML</h2>
    <p>table tag is used to define table in html</p>
    <p>tr is used to define table row</p>
    <p>td is uesd to define table data</p>
    <table>
        <caption>Student Data</caption>
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
    </tr>
    <tr>
       <td>Folabi</td>
       <td>26</td>
       <td>Lagos</td>
    </tr>
    <tr>
        <td> kula</td>
        <td>39</td>
        <td>ibadan</td>
    </tr>
    <tr>
        <td>Ayomide</td>
        <td>18</td>
        <td>Oyo</td>
    </tr>
    <tr>
        <td>Micheal</td>
        <td>48</td>
        <td>osun</td>
    </tr>
    </table>
</body>
</html>
