<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            background-color: gainsboro;
        }
        .container{
            border: 1px solid black;
            width: 80%;
            height: 500px;
            padding: 5px;
            margin: auto;
        
        }
        header{
            background-color: rgb(66, 98, 98);
            text-align: center;
            height: 100px;
            margin-bottom: 10px;
            margin-top: auto;
        }
        main{
            border: 1px solid black;
            background-color: white;
            height: 300px;
            margin-bottom: 10px;
        }
        .box{
            background-color: rgb(77, 107, 97);
            border-radius: 2px;
            border: 1px solid whitesmoke;
            
        }
        .box:hover {
            background-color: blueviolet;
            color: aliceblue;
        }
        footer{
            background-color: grey;
            height: 50px;
            text-align: center;
        }
    </style>
</head>
<body>
  <div class="container">
    <header>
        <h2>Welcome to My Page</h2>
<p>This is a simple with divs and Css</p>
    </header>
    <main>
        <h2>About</h2>
        <p>This section is inside the content div. You can add text,image, or anything here.</p>
        <button class="box">Click me</button>
    </main>
    <footer>
        &copy; 2025 My Simple Wedsite
    </footer>
  </div>  
</body>
</html>
