<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: blueviolet;
            border-radius:10px ;
            width: 100px ;
            height: 100px ;
            animation: example 4s normal infinite;
            position: relative;
        }
        @keyframes example {
            0%{background-color: red; left: 0;top: 0;}
            25%{background-color: pink; left: 200px; top: 0;}
            50%{background-color: brown; left: 20px; top: 200px;}
            73%{background-color: blanchedalmond; left: 0px; top: 0;}
        }
    </style>
</head>
<body>
 <div class="box"></div>   
</body>
</html>
